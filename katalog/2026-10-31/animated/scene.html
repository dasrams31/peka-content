<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: PoppinsXB; src: url(assets/Poppins-ExtraBold.ttf); }
  @font-face { font-family: PoppinsB; src: url(assets/Poppins-Bold.ttf); }
  @font-face { font-family: PoppinsSB; src: url(assets/Poppins-SemiBold.ttf); }
  @font-face { font-family: DejaVuMonoB; src: url(assets/DejaVuSansMono-Bold.ttf); }
  @font-face { font-family: DejaVu; src: url(assets/DejaVuSans.ttf); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFD60A; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; background: #FFD60A; overflow: hidden; }
  .card { position: absolute; left: 40px; right: 40px; top: 40px; bottom: 40px;
          background: #111111; border-radius: 44px; overflow: hidden; }
  .card-dash { position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px;
          border: 3px dashed rgba(246,241,230,0.35); border-radius: 34px; }
  .scene { position: absolute; inset: 0; padding: 80px 70px 0 70px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .stamp { border: 5px solid #FFD60A; padding: 8px 24px; transform: rotate(-3deg); }
  .stamp span { font-family: PoppinsXB; font-size: 56px; color: #FFD60A; letter-spacing: 1px; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img { height: 96px; }
  .lockup span { font-family: PoppinsB; font-size: 34px; color: #F6F1E6; }
  .kick { font-family: PoppinsB; font-size: 36px; color: #FFD60A; letter-spacing: 6px; margin-top: 90px; }
  h1 { font-family: PoppinsXB; font-size: 116px; line-height: 1.06; color: #F6F1E6; margin-top: 36px; }
  .hl { background: #FFD60A; color: #111111; padding: 2px 22px; }
  .sub { font-family: PoppinsSB; font-size: 42px; line-height: 1.45; color: #F6F1E6; margin-top: 44px; }
  .sub-mut { font-family: PoppinsSB; font-size: 42px; line-height: 1.45; color: #AAA59A; margin-top: 12px; }
  .mascot-big { display: block; height: 460px; margin: 50px auto 0 auto; }
  .geser { font-family: DejaVuMonoB; font-size: 34px; color: #FFD60A; margin-top: 56px; text-align: center; letter-spacing: 2px; }
  .sec { font-family: PoppinsSB; font-size: 38px; color: #FFD60A; letter-spacing: 6px; margin-top: 96px; }
  .sec.first { margin-top: 340px; }
  .s3 .sec.first { margin-top: 420px; }
  .row { display: flex; align-items: baseline; margin-top: 30px; }
  .row .nm { font-family: PoppinsSB; font-size: 52px; color: #F6F1E6; white-space: nowrap; }
  .row .dots { flex: 1; border-bottom: 5px dotted rgba(246,241,230,0.4); margin: 0 20px; height: 20px; }
  .row .pr { font-family: PoppinsB; font-size: 62px; color: #FFD60A; white-space: nowrap; }
  .row-note { font-family: PoppinsSB; font-size: 38px; color: #AAA59A; margin-top: 10px; }
  .cta-band { background: #FFD60A; border-radius: 24px; padding: 30px 20px; text-align: center;
          font-family: PoppinsB; font-size: 40px; color: #111111; margin-top: 70px; }
  .q { font-family: PoppinsB; font-size: 56px; line-height: 1.3; color: #F6F1E6; margin-top: 360px; }
  .next { font-family: DejaVu; font-size: 40px; line-height: 1.5; color: #AAA59A; margin-top: 40px; }
  .next b { color: #F6F1E6; font-family: PoppinsSB; }
  .foot { position: absolute; left: 70px; right: 70px; bottom: 52px; font-family: DejaVu;
          font-size: 26px; color: #AAA59A; letter-spacing: 1px; }
  #progress { position: absolute; left: 0; bottom: 0; height: 10px; background: #111111; width: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="card"><div class="card-dash"></div><div id="scenes"></div>
  <div class="foot">GABUNG KE KOMUNITAS KAMI: URL.PEKA.AI.ID</div></div>
  <div id="progress"></div>
</div>
<script>
  const DURATIONS = [3, 5, 4, 3];
  const TOTAL = DURATIONS.reduce((a, b) => a + b, 0);
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function header() {
    return '<div class="top">' +
      '<div class="stamp" data-in="0.10,0.40,0,40"><span>PEKA</span></div>' +
      '<div class="lockup" data-in="0.10,0.40,0,40">' +
      '<img src="assets/mascot-keyed.png"><span>peka.ai.id</span></div></div>';
  }
  function row(p, delay) {
    return '<div class="sec' + (delay === 0.3 ? ' first' : '') + '" data-in="' + delay + ',0.45,0,30">' +
      p.sec + '</div>' +
      '<div class="row" data-in="' + (delay + 0.15) + ',0.45,0,30">' +
      '<span class="nm">' + p.name + ' &middot; ' + p.dur + '</span>' +
      '<span class="dots"></span><span class="pr">' + p.price + '</span></div>' +
      (p.note ? '<div class="row-note" data-in="' + (delay + 0.3) + ',0.45,0,30">' + p.note + '</div>' : '');
  }
  window.buildScene = function(spec) {
    const ps = spec.products;
    let html = '<div class="scene">' + header() +
      '<div class="kick" data-in="0.30,0.45,0,40">KATALOG HARI INI</div>' +
      '<h1><span data-in="0.50,0.50,0,70" style="display:block">AKUN PREMIUM</span>' +
      '<span data-in="0.70,0.50,0,70" style="display:block">MULAI <span class="hl">11K.</span></span></h1>' +
      '<p class="sub" data-in="1.05,0.50,0,40">5 akun ready hari ini.</p>' +
      '<p class="sub-mut" data-in="1.25,0.50,0,40">' + spec.date + '. Harga dalam ribuan rupiah.</p>' +
      '<img class="mascot-big" data-in="1.45,0.50,0,50" src="assets/mascot-keyed.png">' +
      '<div class="geser" data-in="1.80,0.50,0,30">GESER BUAT LIHAT HARGANYA</div></div>';
    html += '<div class="scene">' + header() +
      row(ps[0], 0.3) + row(ps[1], 1.2) + row(ps[2], 2.1) + '</div>';
    html += '<div class="scene s3">' + header() +
      row(ps[3], 0.3) + row(ps[4], 1.2) +
      '<div class="cta-band" data-in="2.10,0.45,0,30">MAU? CHAT: MAU [NAMA PRODUK]</div></div>';
    html += '<div class="scene">' + header() +
      '<p class="q" data-in="0.30,0.50,0,60">Kamu mau yang mana dulu?</p>' +
      '<p class="next" data-in="0.80,0.50,0,40">Chat: <b>MAU [nama produk]</b>.</p>' +
      '<p class="next" data-in="1.10,0.50,0,40">Gabung grup WA lewat <b>url.peka.ai.id</b>.</p>' +
      '<p class="next" data-in="1.40,0.50,0,40">Follow @peka.ai.id, save dan share biar makin banyak yang kebantu.</p></div>';
    document.getElementById('scenes').innerHTML = html;
  };
  window.renderAt = function(t) {
    let acc = 0, si = DURATIONS.length - 1, lt = 0;
    for (let i = 0; i < DURATIONS.length; i++) {
      if (t < acc + DURATIONS[i]) { si = i; lt = t - acc; break; }
      acc += DURATIONS[i];
      if (i === DURATIONS.length - 1) lt = DURATIONS[i];
    }
    const scenes = document.getElementById('scenes').children;
    for (let i = 0; i < scenes.length; i++) {
      const el = scenes[i];
      if (i === si) {
        el.style.display = 'block';
        const fadeIn = clamp01(lt / 0.3), fadeOut = clamp01((DURATIONS[si] - lt) / 0.3);
        el.style.opacity = Math.min(fadeIn, fadeOut);
      } else el.style.display = 'none';
    }
    const scene = scenes[si];
    if (scene) scene.querySelectorAll('[data-in]').forEach(el => {
      const [d, dur, dx, dy] = el.dataset.in.split(',').map(Number);
      const p = easeOut(clamp01((lt - d) / dur));
      el.style.opacity = p;
      el.style.transform = `translate(${dx * (1 - p)}px, ${dy * (1 - p)}px)`;
    });
    document.getElementById('progress').style.width = (t / TOTAL * 1080) + 'px';
  };
  renderAt(0);
</script>
</body>
</html>
