<script>
"use strict";
// =====================================================================
//  KOMIK PEKA #02 — "Ngoding pakai DeepSeek, bukan Claude?" (terminal
//  variant of the peka-komik style). F2 morph chain, 8.0s @ 120 BPM,
//  24fps. Night: Piko confused in front of a terminal window; the
//  cursor circle morphs into a DONE check circle at 4.0s and Piko is
//  happy: one small task first.
//  Build: node <skill>/tools/build.mjs <this piece dir>.
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '4:5': [1080, 1350], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = typeof BEATS !== 'undefined' ? BEATS.bpm : 120, GRID0 = typeof BEATS !== 'undefined' ? BEATS.offset : 0;
const BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 8.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { '9:16': { top: 240, bottom: 420, right: 140 }, '4:5': { top: 80, bottom: 160, right: 60 }, '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const M1 = onBeat(4.0);                                      // the morph: cursor circle -> DONE check circle
const ERA_LIST = [[0, M1, () => sceneNight()], [M1, DURATION, () => sceneMorning()]];
const SHOTS = [
  //  key        era  t0    t1        title
  ['night',      0,   0.0,  M1,       'ngoding pakai apa?'],
  ['morning',    1,   M1,   DURATION, 'coba satu tugas kecil'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [M1],
  cues: { wake: onBeat(1.0), flowers: onBeat(4.75) },
  acts: [
    { name: '1 Bingung',   role: 'build', t0: 0.0, t1: M1 },
    { name: '2 Coba dulu', role: 'gift',  t0: M1, t1: DURATION },
  ],
  board: [
    { t: 2.5, title: 'bingung di depan terminal', sound: 'a soft pad; a rising fifth', next: 'kursor jadi centang DONE' },
    { t: 7.0, title: 'satu file jadi', sound: 'a warm chord', next: 'loops' },
  ],
  narration: (typeof VOICE !== 'undefined' ? VOICE.lines : []),
};
window.TIMELINE = TIMELINE;
